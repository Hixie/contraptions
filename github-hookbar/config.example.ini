# Copy this file to ~/.config/github-hookbar/config.ini and fill in your values.

[relay]
# The host and port where the webhook relay accepts connections.
address = relay.example.com:8081

[github]
# Only pull requests authored by these logins run the command.
# Comma-separated, case-insensitive. Leave empty to run it for every author.
authors = octocat

# Only pull requests in repositories owned by these organizations or users
# run the command. Comma-separated, case-insensitive. Leave empty to accept
# any owner.
orgs =

# Which pull_request actions run the command. "opened" covers new pull
# requests, including drafts. You could add "reopened, ready_for_review".
actions = opened

[command]
# Your login shell runs this line, as an interactive login shell so that it
# sees the same environment a terminal does, with the pull request's URL added
# as its last argument.
run = open
