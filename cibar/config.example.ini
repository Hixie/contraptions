# cibar's configuration. cibar reads it from ~/.config/cibar/config.ini, or
# from the file given with --config PATH.

# The relay of GitHub webhook deliveries, as HOST:PORT.
[relay]
address = github-webhooks.example.com:8081

# The repository owners to follow, separated by commas. Empty, or left out,
# follows every owner whose deliveries reach the relay.
[github]
owners = octo-org

# What to do when a job fails. Without this section, cibar starts no Codex
# sessions.
#
# folder is where each session starts; a relative folder is taken from the
# home folder. prompt is the request; an empty one starts no session, and
# without one, it is the one below. In it, \n is a line break, \\ is a
# backslash, and these are filled in: {repository}, {branch}, {workflow},
# {job}, {job_url}, {event}, {sha}, {run_url}, {checks_url}, {report}.
[codex]
folder = ~/src
prompt = Select an appropriate worktree and fix the failing {job} job of the {workflow} workflow on the {branch} branch of {repository}: {job_url}\n\n{report}
